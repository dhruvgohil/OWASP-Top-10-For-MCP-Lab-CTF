server {
    listen 3200;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (belt-and-braces alongside the backend's own).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Self-hosted SPA + Google Fonts; no inline script needed by Vite output.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;

    # Same-origin API proxy → cookies stay first-party, no CORS needed.
    location /api/ {
        proxy_pass http://backend:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
